name: "[TEMP DEBUG] Store API scripts"

# Throwaway workflow used to live-verify the new ASC/Play API automation
# scripts against real credentials via CI (no local credentials for this
# app are available). Deleted before the real PR lands -- see the task
# notes on debug-branch iteration.

on:
  workflow_dispatch:
    inputs:
      ios_status:
        type: boolean
        default: false
      ios_create_draft:
        type: boolean
        default: false
      ios_verify_metadata:
        type: boolean
        default: false
      android_listing:
        type: boolean
        default: false
      android_sub_status:
        type: boolean
        default: false
      android_sub_create_draft:
        type: boolean
        default: false

jobs:
  ios-scripts:
    if: inputs.ios_status || inputs.ios_create_draft || inputs.ios_verify_metadata
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: packages/mobile/ios

      - name: subscription status
        if: inputs.ios_status
        working-directory: packages/mobile/ios
        run: bundle exec ruby fastlane/scripts/manage_subscriptions.rb status

      - name: subscription create_draft
        if: inputs.ios_create_draft
        working-directory: packages/mobile/ios
        run: bundle exec ruby fastlane/scripts/manage_subscriptions.rb create_draft

      - name: subscription status after create
        if: inputs.ios_create_draft
        working-directory: packages/mobile/ios
        run: bundle exec ruby fastlane/scripts/manage_subscriptions.rb status

      - name: verify_metadata lane
        if: inputs.ios_verify_metadata
        working-directory: packages/mobile/ios
        run: bundle exec fastlane verify_metadata

  android-scripts:
    if: inputs.android_listing || inputs.android_sub_status || inputs.android_sub_create_draft
    runs-on: ubuntu-latest
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - name: publish listing
        if: inputs.android_listing
        run: bash scripts/store-promo/publish-play-listing.sh

      - name: activate service account (for subscription scripts)
        if: inputs.android_sub_status || inputs.android_sub_create_draft
        run: |
          KEY_FILE=$(mktemp)
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$KEY_FILE"
          SA_ACCOUNT=$(python3 -c "import json; print(json.load(open('$KEY_FILE'))['client_email'])")
          gcloud auth activate-service-account "$SA_ACCOUNT" --key-file="$KEY_FILE"
          echo "SA_ACCOUNT=$SA_ACCOUNT" >> "$GITHUB_ENV"

      - name: subscription status
        if: inputs.android_sub_status
        run: |
          sed -i.bak "s/^SA_ACCOUNT = .*/SA_ACCOUNT = \"$SA_ACCOUNT\"/" scripts/store-promo/manage-play-subscriptions.py
          python3 scripts/store-promo/manage-play-subscriptions.py status

      - name: subscription create-draft
        if: inputs.android_sub_create_draft
        run: |
          sed -i.bak "s/^SA_ACCOUNT = .*/SA_ACCOUNT = \"$SA_ACCOUNT\"/" scripts/store-promo/manage-play-subscriptions.py
          python3 scripts/store-promo/manage-play-subscriptions.py create-draft
          python3 scripts/store-promo/manage-play-subscriptions.py status
