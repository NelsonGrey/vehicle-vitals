name: "Set APPLE_SHARED_SECRET in Firebase"

on:
  workflow_dispatch: {}

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set APPLE_SHARED_SECRET in Secret Manager for all 3 projects
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_DEV: ${{ secrets.FIREBASE_PROJECT_DEV }}
          FIREBASE_PROJECT_STAGING: ${{ secrets.FIREBASE_PROJECT_STAGING }}
          FIREBASE_PROJECT_PROD: ${{ secrets.FIREBASE_PROJECT_PROD }}
          APPLE_SHARED_SECRET: ${{ secrets.APPLE_SHARED_SECRET }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN is not set"
            exit 1
          fi
          if [ -z "$APPLE_SHARED_SECRET" ]; then
            echo "APPLE_SHARED_SECRET is not set"
            exit 1
          fi

          for PROJECT_ID in "$FIREBASE_PROJECT_DEV" "$FIREBASE_PROJECT_STAGING" "$FIREBASE_PROJECT_PROD"; do
            echo "Setting APPLE_SHARED_SECRET for $PROJECT_ID"
            printf '%s' "$APPLE_SHARED_SECRET" | firebase functions:secrets:set APPLE_SHARED_SECRET \
              --project="$PROJECT_ID" \
              --token="$FIREBASE_TOKEN" \
              --data-file=- \
              --force
          done

          echo "Done. This workflow file can be deleted now that the secret is set."
